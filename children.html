<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>児童情報データベース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #FAFAF6;
    --panel: #FFFFFF;
    --ink: #262622;
    --ink-soft: #6B6A62;
    --line: #DEDACC;
    /* 児童DBの識別色（スタッフDBは黄緑、児童DBはテラコッタ） */
    --primary: #C2772A;
    --primary-soft: #FBF0E2;
    /* ブランドの黄緑は共通アクセントとして両方で使用 */
    --accent: #93B23C;
    --accent-soft: #EEF4DC;
    --danger: #A6462F;
    --warn: #B8912A;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  h1,h2,h3{ font-family:'Zen Kaku Gothic New', sans-serif; }

  .demo-banner{
    background:#FBF1D6; color:#6B5417; font-size:12.5px;
    text-align:center; padding:6px 10px; flex-shrink:0;
  }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; background:var(--primary); color:#fff; flex-shrink:0;
  }
  header.top .brand{ display:flex; align-items:baseline; gap:10px; }
  header.top .brand h1{ font-size:19px; margin:0; font-weight:700; letter-spacing:.02em; }
  header.top .brand span{ font-size:12px; color:#FCEEDC; }
  header.top select{
    background:transparent; border:1px solid rgba(255,255,255,.75);
    color:#fff; padding:6px 10px; font-size:13px; border-radius:var(--radius);
  }
  header.top select option{ color:#111; }
  .hdr-btn{
    background:none; border:1px solid rgba(255,255,255,.75); color:#fff;
    padding:6px 12px; font-size:12.5px; border-radius:var(--radius);
    cursor:pointer; font-family:inherit; margin-left:10px;
  }

  .layout{ display:grid; grid-template-columns:330px 1fr; flex:1; min-height:0; }
  @media (max-width:820px){
    .layout{ grid-template-columns:1fr; }
    .list-pane.hide-on-mobile{ display:none; }
    .detail-pane.hide-on-mobile{ display:none; }
  }

  .list-pane{
    border-right:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column; min-height:0; overflow:hidden;
  }
  .search-row{
    padding:14px; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:8px; flex-shrink:0;
  }
  .search-row input:not([type="checkbox"]), .search-row select{
    width:100%; padding:9px 10px; border:1px solid var(--line);
    border-radius:var(--radius); font-size:14px; font-family:inherit; background:#fff;
  }
  .search-row input:not([type="checkbox"]):focus, .search-row select:focus{
    outline:2px solid var(--primary); outline-offset:-1px;
  }
  .check-label{
    display:flex; align-items:center; gap:6px;
    font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
  .add-btn{
    padding:9px 10px; border:1px solid var(--primary); background:var(--primary);
    color:#fff; border-radius:var(--radius); font-size:13px; cursor:pointer; font-family:inherit;
  }
  .add-btn:hover{ background:#a8641f; }
  .secondary-btn{
    padding:9px 10px; border:1px solid var(--line); background:#fff;
    color:var(--primary); border-radius:var(--radius); font-size:13px;
    cursor:pointer; font-family:inherit;
  }
  .secondary-btn:hover{ border-color:var(--primary); }
  .btn-row{ display:flex; gap:8px; }
  .btn-row .secondary-btn{ flex:1; }

  .result-count{
    font-size:11.5px; color:var(--ink-soft); padding:8px 14px 4px; flex-shrink:0;
  }

  .kid-list{ list-style:none; margin:0; padding:0; overflow-y:auto; flex:1; min-height:0; }
  .kid-list li{
    padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer;
    display:flex; flex-direction:row; justify-content:space-between; align-items:center; gap:8px;
  }
  .kid-list li:hover{ background:var(--primary-soft); }
  .kid-list li.active{ background:var(--primary-soft); border-left:3px solid var(--primary); }
  .kid-list li .select-check{ width:auto; flex-shrink:0; cursor:pointer; }
  .bulk-action-bar{
    display:flex; align-items:center; gap:10px;
    padding:8px 14px; background:#FBF1D6; border-bottom:1px solid var(--line);
    font-size:12.5px; color:#6B5417; flex-shrink:0;
  }
  .bulk-action-bar span{ flex:1; }
  .bulk-delete-btn{
    background:var(--danger); color:#fff; border:1px solid var(--danger);
    padding:5px 12px; font-size:12px; border-radius:var(--radius);
    cursor:pointer; font-family:inherit;
  }
  .bulk-clear-btn{
    background:none; color:#6B5417; border:1px solid rgba(0,0,0,.15);
    padding:5px 10px; font-size:12px; border-radius:var(--radius);
    cursor:pointer; font-family:inherit;
  }
  .delete-toggle{
    background:none; border:1px solid var(--danger); color:var(--danger);
    padding:7px 14px; font-size:13px; border-radius:var(--radius);
    cursor:pointer; font-family:inherit; margin-left:8px;
  }
  .delete-toggle:hover{ background:#F6E3DE; }
  .kid-list .name{ font-size:15px; font-weight:500; }
  .kid-list .sub{ font-size:11px; color:var(--ink-soft); display:block; }
  .kid-list .fac-tag{
    font-size:10.5px; color:var(--ink-soft); border:1px solid var(--line);
    padding:2px 8px; border-radius:20px; white-space:nowrap; align-self:flex-start;
  }
  .kid-list .empty{ padding:24px 14px; color:var(--ink-soft); font-size:13px; text-align:center; }

  .detail-pane{ padding:24px 28px 60px; overflow-y:auto; min-height:0; }
  .back-btn{
    display:none; background:none; border:none; color:var(--primary);
    font-size:14px; cursor:pointer; padding:0 0 12px; font-family:inherit;
  }
  @media (max-width:820px){
    .back-btn.show{ display:block; }
    .detail-pane{ padding-bottom:90px; }
    .save-row{
      position:fixed; left:0; right:0; bottom:0; margin-top:0; padding:12px 16px;
      background:var(--panel); border-top:1px solid var(--line);
      box-shadow:0 -4px 10px rgba(0,0,0,0.08); z-index:50;
    }
  }

  .detail-header{
    display:flex; gap:20px; align-items:flex-start;
    padding-bottom:20px; border-bottom:1px solid var(--line); margin-bottom:20px;
  }
  .photo-box{ position:relative; width:88px; height:88px; flex-shrink:0; }
  .avatar{
    width:100%; height:100%; border-radius:50%;
    background:var(--primary-soft); color:var(--primary);
    display:flex; align-items:center; justify-content:center;
    font-size:28px; font-weight:700; border:1px solid var(--line); overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-edit-row{ display:flex; flex-direction:column; gap:4px; margin-top:6px; }
  .photo-edit-row label, .photo-edit-row button{
    font-size:10.5px; text-align:center; padding:3px 4px;
    border:1px solid var(--line); border-radius:var(--radius);
    background:#fff; color:var(--primary); cursor:pointer; font-family:inherit;
  }
  .photo-edit-row button.remove{ color:var(--danger); }
  .list-thumb{
    width:30px; height:30px; border-radius:50%; object-fit:cover;
    flex-shrink:0; border:1px solid var(--line);
  }
  .list-thumb-fallback{
    width:30px; height:30px; border-radius:50%; background:var(--primary-soft);
    color:var(--primary); display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; flex-shrink:0; border:1px solid var(--line);
  }
  #crop-viewport{
    position:relative; width:260px; height:260px; margin:0 auto;
    overflow:hidden; border-radius:50%; border:1px solid var(--line);
    background:#e5e5e0; cursor:grab; touch-action:none;
  }
  #crop-viewport.dragging{ cursor:grabbing; }
  #crop-image{
    position:absolute; left:0; top:0; user-select:none;
    -webkit-user-drag:none; pointer-events:none; max-width:none;
  }
  .crop-zoom-row{ display:flex; align-items:center; gap:8px; margin:16px auto 0; max-width:280px; }
  .crop-zoom-row input[type="range"]{ flex:1; }
  .crop-zoom-label{ font-size:11px; color:var(--ink-soft); white-space:nowrap; }
  .crop-actions{ display:flex; justify-content:center; gap:10px; margin-top:18px; }
  .crop-actions button{
    font-family:inherit; font-size:14px; padding:9px 20px;
    border-radius:var(--radius); cursor:pointer;
  }
  .crop-actions .save{ background:var(--primary); color:#fff; border:1px solid var(--primary); }
  .crop-actions .cancel{ background:none; color:var(--ink-soft); border:1px solid var(--line); }

  .collapsible-header{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; background:none; border:none; padding:6px 2px;
    font-size:12px; font-weight:700; color:var(--ink-soft);
    letter-spacing:.02em; cursor:pointer; font-family:inherit;
  }
  .collapsible-header:hover{ color:var(--primary); }
  .collapsible-header .chevron{ font-size:11px; transition:transform .15s ease; }
  .collapsible-header.open .chevron{ transform:rotate(90deg); }
  .collapsible-body{
    display:flex; flex-direction:column; gap:8px;
    padding-bottom:10px;
  }
  .collapsible-body.collapsed{ display:none; }
  .collapsible + .collapsible{ border-top:1px solid var(--line); margin-top:2px; padding-top:6px; }
  .id-block h2{ margin:0 0 2px; font-size:22px; }
  .id-block .sub{ color:var(--ink-soft); font-size:13px; margin-bottom:8px; display:block; }
  .badge-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .badge{
    font-size:11.5px; padding:3px 9px; border-radius:20px;
    border:1px solid var(--line); color:var(--ink-soft);
  }
  .badge.grade{ background:var(--accent-soft); color:#57692A; border-color:transparent; }
  .badge.status-active{ background:var(--accent-soft); color:#57692A; border-color:transparent; }
  .badge.status-left{ background:#F5EBE5; color:var(--danger); border-color:transparent; }
  .badge.alert-expired{ background:#F6E3DE; color:var(--danger); border-color:transparent; font-weight:700; }
  .badge.alert-soon{ background:#FBF1D6; color:#7A5E12; border-color:transparent; font-weight:700; }

  .mini-alert{
    display:inline-block; font-size:9.5px; font-weight:700; color:#fff;
    padding:1px 6px; border-radius:3px; margin-left:6px; vertical-align:middle;
  }
  .mini-alert.expired{ background:var(--danger); }
  .mini-alert.soon{ background:var(--warn); }
  /* NEWバッジは受給者証アラート（赤・金）と混同しないよう、ブランドの黄緑（accent）で区別 */
  .new-badge{
    display:inline-block;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.03em;
    color:#fff;
    background:var(--accent);
    padding:1px 6px;
    border-radius:3px;
    margin-left:6px;
    vertical-align:middle;
  }

  .edit-toggle{
    margin-left:auto; align-self:flex-start; background:none;
    border:1px solid var(--line); padding:7px 14px; font-size:13px;
    border-radius:var(--radius); cursor:pointer; color:var(--primary); font-family:inherit;
  }
  .edit-toggle:hover{ border-color:var(--primary); }

  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:22px; }
  .tab-btn{
    background:none; border:none; padding:10px 4px; margin-right:22px;
    font-size:14px; color:var(--ink-soft); cursor:pointer;
    border-bottom:2px solid transparent; font-family:inherit;
  }
  .tab-btn.active{ color:var(--primary); border-bottom-color:var(--primary); font-weight:500; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px 32px; }
  @media (max-width:600px){ .field-grid{ grid-template-columns:1fr; } }
  .field-grid.span-2{ grid-template-columns:1fr; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11.5px; color:var(--ink-soft); letter-spacing:.02em; }
  .field .value{ font-size:15px; padding-bottom:6px; border-bottom:1px solid var(--line); min-height:22px; }
  .field input, .field select{
    font-size:15px; padding:6px 2px; border:none;
    border-bottom:1px solid var(--primary); background:var(--primary-soft); font-family:inherit;
  }
  .field input:focus, .field select:focus{ outline:none; }

  .section-title{
    font-size:13px; color:var(--ink-soft); margin:28px 0 12px;
    padding-bottom:6px; border-bottom:1px solid var(--line);
  }

  .expiry-callout{
    padding:12px 16px; border-radius:var(--radius); font-size:13.5px;
    margin-bottom:20px; line-height:1.6;
  }
  .expiry-callout.expired{ background:#F6E3DE; color:#7A2E1C; }
  .expiry-callout.soon{ background:#FBF1D6; color:#6B5417; }

  .save-row{ margin-top:28px; padding:0; display:flex; gap:10px; }
  .save-row button{
    font-family:inherit; font-size:14px; padding:9px 20px;
    border-radius:var(--radius); cursor:pointer;
  }
  .save-row .save{ background:var(--primary); color:#fff; border:1px solid var(--primary); }
  .save-row .cancel{ background:none; color:var(--ink-soft); border:1px solid var(--line); }

  .no-selection{ color:var(--ink-soft); font-size:14px; padding:60px 20px; text-align:center; }

  .hist-title{ font-size:13px; color:var(--ink-soft); margin:0 0 10px; letter-spacing:.02em; }
  table.hist-table{ width:100%; border-collapse:collapse; font-size:14px; }
  table.hist-table th{
    text-align:left; font-size:11.5px; font-weight:500; color:var(--ink-soft);
    border-bottom:1px solid var(--line); padding:6px 8px;
  }
  table.hist-table td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.hist-table input, table.hist-table select{
    width:100%; font-size:14px; font-family:inherit;
    border:1px solid var(--line); padding:5px 6px; border-radius:var(--radius);
  }
  .hist-remove{
    background:none; border:none; color:var(--danger);
    font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .hist-add{
    margin-top:10px; background:none; border:1px dashed var(--line);
    color:var(--primary); padding:7px 12px; font-size:13px;
    border-radius:var(--radius); cursor:pointer; font-family:inherit;
  }
  .hist-add:hover{ border-color:var(--primary); }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(38,38,34,.35);
    display:flex; align-items:center; justify-content:center; z-index:60;
  }
  .modal{
    background:#fff; width:min(480px, 92vw); padding:24px;
    border-radius:var(--radius); max-height:86vh; overflow-y:auto;
  }
  .modal h3{ margin-top:0; }
  .modal .field{ margin-bottom:14px; }
  .modal .field input, .modal .field select{
    border:1px solid var(--line); background:#fff; padding:8px; border-radius:var(--radius);
  }
</style>
</head>
<body>

<div class="demo-banner" id="demo-banner">
  ⚠ デモモード：クラウド未接続のため、この端末内だけの仮データで動作しています
</div>

<header class="top">
  <div class="brand">
    <h1>児童情報データベース</h1>
    <span id="fac-count-label"></span>
  </div>
  <div>
    <select id="facility-filter">
      <option value="all">全事業所を表示</option>
    </select>
    <button class="hdr-btn" id="btn-home">← ホーム</button>
    <span class="hdr-btn" id="role-badge" style="display:none; cursor:default;"></span>
    <button class="hdr-btn" id="logout-btn" style="display:none;">ログアウト</button>
  </div>
</header>

<div class="layout">
  <aside class="list-pane" id="list-pane">
    <div class="search-row">
      <div class="collapsible">
        <button class="collapsible-header open" data-target="section-search">
          <span>検索・絞り込み</span><span class="chevron">▸</span>
        </button>
        <div class="collapsible-body" id="section-search">
          <input type="text" id="search-input" placeholder="氏名・フリガナ・学校名で検索">
          <select id="status-filter">
            <option value="active">在籍児のみ表示</option>
            <option value="all">全員表示（退所児含む）</option>
            <option value="left">退所児のみ表示</option>
          </select>
          <label class="check-label">
            <input type="checkbox" id="show-new-only" style="width:auto;">
            新規のみ表示（入所3ヶ月以内）
          </label>
        </div>
      </div>

      <div class="collapsible">
        <button class="collapsible-header" data-target="section-manage">
          <span>新規登録・データ取込</span><span class="chevron">▸</span>
        </button>
        <div class="collapsible-body collapsed" id="section-manage">
          <button class="add-btn" id="open-add-modal">＋ 児童を新規追加</button>
          <div class="btn-row">
            <button class="secondary-btn" id="download-template">テンプレートDL</button>
            <button class="secondary-btn" id="open-import">Excelから取込</button>
          </div>
          <button class="secondary-btn" id="export-all" style="width:100%;">一覧をExcelに書き出し</button>
          <input type="file" id="excel-input" accept=".xlsx,.xls,.csv" style="display:none;">
        </div>
      </div>

      <div class="collapsible">
        <button class="collapsible-header" data-target="section-reports">
          <span>帳票の出力（事業所ごと）</span><span class="chevron">▸</span>
        </button>
        <div class="collapsible-body collapsed" id="section-reports">
          <div class="btn-row">
            <button class="secondary-btn" id="export-checklist">チェックリスト</button>
            <button class="secondary-btn" id="export-birthday">誕生日リスト</button>
          </div>
          <button class="secondary-btn" id="export-address" style="width:100%;">住所録</button>
        </div>
      </div>
    </div>
    <div id="result-count" class="result-count"></div>
    <div id="bulk-action-bar" class="bulk-action-bar" style="display:none;">
      <span id="bulk-count-label"></span>
      <button class="bulk-delete-btn" id="bulk-delete-btn">削除する</button>
      <button class="bulk-clear-btn" id="bulk-clear-btn">選択解除</button>
    </div>
    <ul class="kid-list" id="kid-list"></ul>
  </aside>

  <section class="detail-pane" id="detail-pane">
    <button class="back-btn" id="back-btn">← 一覧に戻る</button>
    <div id="detail-content">
      <div class="no-selection">左の一覧から児童を選択してください</div>
    </div>
  </section>
</div>

<div class="modal-backdrop" id="modal-backdrop" style="display:none;">
  <div class="modal">
    <h3>児童の新規登録</h3>
    <div class="field"><label>氏名</label><input id="m-name" placeholder="山田 花子"></div>
    <div class="field"><label>フリガナ</label><input id="m-kana" placeholder="ヤマダ ハナコ"></div>
    <div class="field"><label>生年月日</label><input id="m-birthday" type="date"></div>
    <div class="field"><label>性別</label>
      <select id="m-gender"><option value="">未選択</option><option>男性</option><option>女性</option></select>
    </div>
    <div class="field"><label>所属事業所</label><select id="m-facility"></select></div>
    <div class="field"><label>学校</label><input id="m-school" placeholder="○○小学校"></div>
    <div class="field"><label>通所受給者証番号</label><input id="m-certno" placeholder="半角数字"></div>
    <div class="field"><label>契約開始日</label><input id="m-start" type="date"></div>
    <div class="save-row">
      <button class="save" id="m-save">登録する</button>
      <button class="cancel" id="m-cancel">キャンセル</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="login-overlay" style="display:none;">
  <div class="modal">
    <h3>ログイン</h3>
    <div class="field"><label>メールアドレス</label><input id="login-email" type="email" placeholder="staff@example.com"></div>
    <div class="field"><label>パスワード</label><input id="login-password" type="password"></div>
    <div class="save-row">
      <button class="save" id="login-btn">ログイン</button>
    </div>
    <p id="login-error" style="color:var(--danger); font-size:13px; display:none; margin-top:4px;"></p>
  </div>
</div>

<div class="modal-backdrop" id="delete-modal-backdrop" style="display:none;">
  <div class="modal">
    <h3>本当に削除しますか？</h3>
    <p style="font-size:13px; color:var(--ink-soft); margin:0 0 12px;">この操作は取り消せません。削除すると復元できません。</p>
    <div id="delete-target-list" style="max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px; margin-bottom:16px; font-size:14px;"></div>
    <div class="save-row">

function calcAge(birthday){
  if(!birthday) return '—';
  const b = new Date(birthday); if(isNaN(b)) return '—';
  const t = new Date();
  let age = t.getFullYear() - b.getFullYear();
  if(t.getMonth() < b.getMonth() || (t.getMonth()===b.getMonth() && t.getDate() < b.getDate())) age--;
  return age + '歳';
}

// 4月1日時点の年齢から学年を判定
function calcGrade(birthday){
  if(!birthday) return '—';
  const b = new Date(birthday); if(isNaN(b)) return '—';
  const t = new Date();
  const schoolYear = (t.getMonth() >= 3) ? t.getFullYear() : t.getFullYear()-1;
  const april1 = new Date(schoolYear, 3, 1);
  let age = april1.getFullYear() - b.getFullYear();
  if(april1.getMonth() < b.getMonth() || (april1.getMonth()===b.getMonth() && april1.getDate() < b.getDate())) age--;
  if(age < 3) return '未就学';
  if(age >= 18) return '卒業';
  return GRADE_MAP[age] || '—';
}

// 利用開始日からの継続利用年月（退所していれば契約終了日で区切る）
function calcUsagePeriod(startDate, endDate){
  if(!startDate) return '—';
  const s = new Date(startDate); if(isNaN(s)) return '—';
  let end = new Date();
  if(endDate){
    const e = new Date(endDate);
    if(!isNaN(e)) end = e;
  }
  if(end < s) return '—';
  let years = end.getFullYear() - s.getFullYear();
  let months = end.getMonth() - s.getMonth();
  if(end.getDate() < s.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  if(years <= 0 && months <= 0) return '1ヶ月未満';
  const parts = [];
  if(years > 0) parts.push(years + '年');
  if(months > 0) parts.push(months + 'ヶ月');
  return parts.join('');
}

// 受給者証の期限判定（60日以内を「まもなく」とする）
function certStatus(certEnd){
  if(!certEnd) return null;
  const d = new Date(certEnd); if(isNaN(d)) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((d - today) / 86400000);
  if(days < 0)  return { cls:'expired', short:'期限切れ', long:`受給者証の有効期限が ${certEnd} で切れています。更新手続きの確認が必要です。` };
  if(days <= 60) return { cls:'soon', short:`残り${days}日`, long:`受給者証の有効期限まで残り ${days} 日です（${certEnd} まで）。更新の準備をしてください。` };
  return null;
}

function isNewChild(contractStart){
  if(!contractStart) return false;
  const j = new Date(contractStart);
  if(isNaN(j)) return false;
  const ninetyDaysAgo = new Date();
  ninetyDaysAgo.setDate(ninetyDaysAgo.getDate() - 90);
  return j >= ninetyDaysAgo && j <= new Date();
}

        ${field('支給決定終了日', c, 'certEnd', 'date')}
        ${field('支給量', c, 'grantAmount')}
        ${field('契約日数', c, 'contractDays')}
        ${selectField('負担上限月額', c, 'monthlyCap', MONTHLY_CAPS)}
        ${selectField('障害種別', c, 'disabilityType', DISABILITY_TYPES)}
        ${selectField('強度行動障害', c, 'severeBehavior', ['該当なし','該当あり'])}

      </div>
      <p class="section-title">上限管理・併用</p>
      <div class="field-grid">
        ${field('上限管理事業所', c, 'capManageFacility')}
        ${field('併用施設①', c, 'otherFacility1')}
        ${field('併用施設②', c, 'otherFacility2')}
      </div>
    </div>

    <div class="tab-panel ${activeTab==='family'?'active':''}" data-panel="family">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <p class="section-title" style="margin:0; border:none; padding:0;">家族構成</p>
        <button class="secondary-btn" id="show-genogram-btn">ジェノグラムを表示</button>
      </div>
      <table class="hist-table">
        <thead>
          <tr>
            <th style="width:170px;">続柄</th>
            <th>氏名（任意）</th>
            <th style="width:90px;">性別</th>
            <th style="width:70px;">同居</th>
            <th>備考</th>
            ${editing ? '<th style="width:50px;"></th>' : ''}
          </tr>
        </thead>
        <tbody id="family-tbody">
          ${renderFamilyRows(c)}
        </tbody>
      </table>
      ${editing ? '<button class="hist-add" id="family-add-row">＋ 家族を追加</button>' : ''}
    </div>

    ${editing ? `
    <div class="save-row">
      <button class="save" id="save-btn">保存する</button>
      <button class="cancel" id="cancel-btn">キャンセル</button>
    </div>` : ''}
  `;

  document.getElementById('edit-toggle').addEventListener('click', ()=>{
    editing = !editing; tempPhoto = null; pendingPhotoFile = null;
    tempFamily = editing ? JSON.parse(JSON.stringify(c.family || [])) : null;
    renderDetail();
  });

  const deleteSingleBtn = document.getElementById('delete-single-btn');
  if(deleteSingleBtn){
    deleteSingleBtn.addEventListener('click', ()=>{
      openDeleteConfirm([c.id]);
    });
  }

  const genogramBtn = document.getElementById('show-genogram-btn');
  if(genogramBtn){
    genogramBtn.addEventListener('click', ()=>{
      if(editing) syncTempFamilyFromInputs();
      const familyData = editing ? tempFamily : (c.family || []);
      openGenogramModal(c, familyData);
    });
  }
  detailContent.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeTab = btn.dataset.tab;
      detailContent.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      detailContent.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      detailContent.querySelector(`.tab-panel[data-panel="${btn.dataset.tab}"]`).classList.add('active');
    });
  });

  if(editing){
    document.getElementById('save-btn').addEventListener('click', async ()=>{
      syncTempFamilyFromInputs();
      let updatedRef = null;
      children = children.map(x=>{
        if(x.id !== c.id) return x;
        const u = {...x};
        detailContent.querySelectorAll('[data-field]').forEach(inp=>{ u[inp.dataset.field] = inp.value; });
        if(tempPhoto === 'REMOVE') u.photo = null;
        else if(tempPhoto) u.photo = tempPhoto;
        u.family = tempFamily;
        updatedRef = u;
        return u;
      });

      if(isSupabaseConfigured() && updatedRef){
        if(pendingPhotoFile){
          try{
            updatedRef.photo = await uploadChildPhoto(pendingPhotoFile, updatedRef);
          }catch(err){
            alert('写真のアップロードに失敗しました：' + err.message);
          }
        } else if(tempPhoto === 'REMOVE'){
          updatedRef.photo = null;
        }
        await updateChildInDb(updatedRef);
      }

      editing = false; tempPhoto = null; pendingPhotoFile = null; tempFamily = null;
      renderList(); renderDetail();
    });
    document.getElementById('cancel-btn').addEventListener('click', ()=>{
      editing = false; tempPhoto = null; pendingPhotoFile = null; tempFamily = null; renderDetail();
    });

    const famAddBtn = document.getElementById('family-add-row');
    if(famAddBtn){
      famAddBtn.addEventListener('click', ()=>{
        syncTempFamilyFromInputs();
        tempFamily.push({relation:'父', gender:'男性', gen:-1, side:'father', name:'', coRes:true, note:''});
        renderDetail();
      });
    }
    detailContent.querySelectorAll('.hist-remove[data-fam-idx]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        syncTempFamilyFromInputs();
        tempFamily.splice(Number(btn.dataset.famIdx), 1);
        renderDetail();
      });
    });
    detailContent.querySelectorAll('select[data-fam-field="relation"]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        syncTempFamilyFromInputs();
        const idx = Number(sel.dataset.famIdx);
        const preset = presetFor(sel.value);
        tempFamily[idx].relation = sel.value;
        if(preset && preset.side !== 'other'){
          tempFamily[idx].gender = preset.gender || tempFamily[idx].gender;
          tempFamily[idx].gen = preset.gen;
          tempFamily[idx].side = preset.side;
        }
        renderDetail();
      });
    });

    const photoInput = document.getElementById('photo-input');
    if(photoInput){
      photoInput.addEventListener('change', (evt)=>{
        const f = evt.target.files[0]; if(!f) return;
        if(f.size > 8*1024*1024){ alert('画像サイズは8MB以下にしてください'); evt.target.value=''; return; }
        openCropModal(f); evt.target.value = '';
      });
    }
    const photoRemoveBtn = document.getElementById('photo-remove-btn');
    if(photoRemoveBtn){
      photoRemoveBtn.addEventListener('click', ()=>{
        tempPhoto = 'REMOVE'; pendingPhotoFile = null; renderDetail();
      });
    }
  }
}

// ===================== 家族構成（編集テーブル） =====================
function syncTempFamilyFromInputs(){
  const tbody = document.getElementById('family-tbody');
  if(!tbody || !tempFamily) return;
  tbody.querySelectorAll('[data-fam-idx]').forEach(inp=>{
    const idx = Number(inp.dataset.famIdx);
    const key = inp.dataset.famField;
    if(!tempFamily[idx]) return;
    if(!key) return;
    if(inp.type === 'checkbox') tempFamily[idx][key] = inp.checked;
    else if(key === 'gen') tempFamily[idx][key] = inp.value === '' ? null : Number(inp.value);
    else tempFamily[idx][key] = inp.value;
  });
}

function renderFamilyRows(c){
  const rows = editing ? (tempFamily || []) : (c.family || []);
  if(rows.length === 0){
    return `<tr><td colspan="${editing?6:5}" style="color:var(--ink-soft); font-size:13px;">登録されている家族情報はありません</td></tr>`;
  }
  return rows.map((m, idx)=>{
    if(editing){
      const relOptions = RELATION_PRESETS.map(p=>
        `<option value="${p.label}" ${p.label===m.relation?'selected':''}>${p.label}</option>`
      ).join('');
      const isOther = !presetFor(m.relation) || presetFor(m.relation).side === 'other';
      return `<tr>
        <td>
          <select data-fam-idx="${idx}" data-fam-field="relation">${relOptions}</select>
          ${isOther ? `
          <div style="display:flex; gap:4px; margin-top:5px;">
            <input type="number" data-fam-idx="${idx}" data-fam-field="gen" placeholder="世代差" value="${m.gen ?? ''}" style="width:70px;" title="本人を0として、上の世代はマイナス、下の世代はプラス">
            <select data-fam-idx="${idx}" data-fam-field="side">
              <option value="father" ${m.side==='father'?'selected':''}>父方</option>
              <option value="mother" ${m.side==='mother'?'selected':''}>母方</option>
              <option value="sib" ${m.side==='sib'?'selected':''}>本人と同列</option>
            </select>
          </div>` : ''}
        </td>
        <td><input type="text" data-fam-idx="${idx}" data-fam-field="name" value="${m.name||''}"></td>
        <td>
          <select data-fam-idx="${idx}" data-fam-field="gender">
            <option value="" ${!m.gender?'selected':''}></option>
            <option ${m.gender==='男性'?'selected':''}>男性</option>
            <option ${m.gender==='女性'?'selected':''}>女性</option>
          </select>
        </td>
        <td style="text-align:center;">
          <input type="checkbox" data-fam-idx="${idx}" data-fam-field="coRes" ${m.coRes!==false?'checked':''} style="width:auto;">
        </td>
        <td><input type="text" data-fam-idx="${idx}" data-fam-field="note" value="${m.note||''}"></td>
        <td><button class="hist-remove" data-fam-idx="${idx}">削除</button></td>
      </tr>`;
    }
    return `<tr>
      <td>${m.relation||''}</td>
      <td>${m.name||''}</td>
      <td>${m.gender||''}</td>
      <td>${m.coRes!==false ? '同居' : '別居'}</td>
      <td>${m.note||''}</td>
    </tr>`;
  }).join('');
}

// ===================== ジェノグラム（家族構成図） =====================
function openGenogramModal(c, familyData){
  const svg = buildGenogramSVG(c, familyData || []);
  document.getElementById('genogram-canvas').innerHTML = svg;
  document.getElementById('genogram-modal-backdrop').style.display = 'flex';
}
document.getElementById('genogram-close').addEventListener('click', ()=>{
  document.getElementById('genogram-modal-backdrop').style.display = 'none';
});

function buildGenogramSVG(c, family){
  const BOX_W = 104, BOX_H = 56, GAP_X = 30, ROW_GAP = 118, MARGIN = 40;

  const self = { relation:'本人', name:c.name, gender:c.gender||'', gen:0, side:'self', coRes:true, isSelf:true };
  const list = (family||[]).map(m=>({...m, gen: (m.gen===null||m.gen===undefined) ? 0 : m.gen}));

  const byGen = {};
  list.forEach(m=>{ (byGen[m.gen] = byGen[m.gen] || []).push(m); });
  (byGen[0] = byGen[0] || []);

  // 0世代：本人＋きょうだい（本人を先頭に）
  const gen0 = [self, ...byGen[0]];

  function splitSide(arr){
    return {
      father: arr.filter(m=>m.side==='father'),
      mother: arr.filter(m=>m.side==='mother')
    };
  }
  const gN1 = splitSide(byGen[-1] || []);
  // -1世代：父方の兄弟姉妹は左、父は一番右（中央寄り）／母は一番左（中央寄り）、母方の兄弟姉妹は右
  gN1.father.sort((a,b)=> (a.relation==='父'?1:0) - (b.relation==='父'?1:0));
  gN1.mother.sort((a,b)=> (a.relation==='母'?0:1) - (b.relation==='母'?0:1));
  const rowN1 = [...gN1.father, ...gN1.mother];

  const gN2 = splitSide(byGen[-2] || []);
  const gN3 = splitSide(byGen[-3] || []);
  const gP1 = byGen[1] || []; // 「子」など、本人より下の世代

  // その他（想定外の世代／sideがother）
  const knownGens = new Set([-3,-2,-1,0,1]);
  const others = list.filter(m => !knownGens.has(m.gen) || m.side === 'other');

  // ---- 行ごとに横位置を割り付け ----
  const positions = []; // {member, x, y, gen}
  function layoutRow(members, gen, centerX){
    if(members.length === 0) return null;
    const w = members.length*BOX_W + (members.length-1)*GAP_X;
    let x = centerX - w/2;
    const y = MARGIN + (gen + 3) * ROW_GAP; // gen=-3が一番上
    members.forEach(m=>{
      positions.push({ member:m, x: x + BOX_W/2, y, gen });
      x += BOX_W + GAP_X;
    });
    return { centerX, y };
  }

  // すべての行を同じ中心線に揃えてレイアウトする（重なりを避けるため）。
  // 世代が離れた親子が真上に来ないケースは、線をL字に曲げてつなぐ（marriageAndDescent2）。
  const CENTER = 0;
  layoutRow(rowN1, -1, CENTER);
  const fatherPos = positions.find(p=>p.member.relation==='父');
  const motherPos = positions.find(p=>p.member.relation==='母');
  const fatherX = fatherPos ? fatherPos.x : CENTER - BOX_W;
  const motherX = motherPos ? motherPos.x : CENTER + BOX_W;

  const row2 = [...gN2.father, ...gN2.mother];
  if(row2.length) layoutRow(row2, -2, CENTER);
  const gp2f = positions.filter(p=>p.gen===-2 && p.member.side==='father');
  const gp2m = positions.filter(p=>p.gen===-2 && p.member.side==='mother');
  const gp2fCenter = gp2f.length ? (gp2f[0].x + gp2f[gp2f.length-1].x)/2 : fatherX;
  const gp2mCenter = gp2m.length ? (gp2m[0].x + gp2m[gp2m.length-1].x)/2 : motherX;

  const row3 = [...gN3.father, ...gN3.mother];
  if(row3.length) layoutRow(row3, -3, CENTER);

  const midParents = (fatherPos && motherPos) ? (fatherX + motherX)/2 : CENTER;
  layoutRow(gen0, 0, midParents);
  if(gP1.length) layoutRow(gP1, 1, midParents);

  if(others.length){
    const otherY = MARGIN + (1 + (gP1.length?1:0) + 3) * ROW_GAP + 40;
    const w = others.length*BOX_W + (others.length-1)*GAP_X;
    let x = midParents - w/2;
    others.forEach(m=>{
      positions.push({ member:m, x: x + BOX_W/2, y: otherY, gen:'other' });
      x += BOX_W + GAP_X;
    });
  }

  // ---- 全体を正の座標に平行移動 ----
  const minX = Math.min(...positions.map(p=>p.x)) - BOX_W/2 - MARGIN;
  const maxX = Math.max(...positions.map(p=>p.x)) + BOX_W/2 + MARGIN;
  const maxY = Math.max(...positions.map(p=>p.y)) + BOX_H/2 + MARGIN + 20;
  const offsetX = -minX;
  positions.forEach(p=> p.x += offsetX);
  const width = maxX - minX;
  const height = maxY;

  function findPos(pred){ return positions.find(pred); }

  // ---- 線（結婚線・親子線） ----
  let lines = '';

  // 父母の結婚線 → 本人・きょうだいの列へ
  const fatherFinal = findPos(p=>p.gen===-1 && p.member.relation==='父');
  const motherFinal = findPos(p=>p.gen===-1 && p.member.relation==='母');
  if(fatherFinal && motherFinal){
    const midY = fatherFinal.y;
    const midX = (fatherFinal.x + motherFinal.x)/2;
    lines += `<line x1="${fatherFinal.x}" y1="${midY}" x2="${motherFinal.x}" y2="${midY}" stroke="#262622" stroke-width="1.6"/>`;
    const gen0Ys = positions.filter(p=>p.gen===0);
    if(gen0Ys.length){
      const dropY = gen0Ys[0].y - BOX_H/2 - 22;
      lines += `<line x1="${midX}" y1="${midY}" x2="${midX}" y2="${dropY}" stroke="#262622" stroke-width="1.6"/>`;
      const leftMost = Math.min(...gen0Ys.map(p=>p.x));
      const rightMost = Math.max(...gen0Ys.map(p=>p.x));
      lines += `<line x1="${leftMost}" y1="${dropY}" x2="${rightMost}" y2="${dropY}" stroke="#262622" stroke-width="1.6"/>`;
      gen0Ys.forEach(p=>{
        lines += `<line x1="${p.x}" y1="${dropY}" x2="${p.x}" y2="${p.y - BOX_H/2}" stroke="#262622" stroke-width="1.6"/>`;
      });
    }
  }
  // 父方きょうだい同士の連結（叔父叔母と父）
  if(gN1.father.length > 1){
    const ys = positions.filter(p=>p.gen===-1 && p.member.side==='father');
    const y = ys[0].y - BOX_H/2 - 12;
    const xs = ys.map(p=>p.x);
    lines += `<line x1="${Math.min(...xs)}" y1="${y}" x2="${Math.max(...xs)}" y2="${y}" stroke="#8a8a80" stroke-width="1.2" stroke-dasharray="3,3"/>`;
    ys.forEach(p=> lines += `<line x1="${p.x}" y1="${y}" x2="${p.x}" y2="${p.y - BOX_H/2}" stroke="#8a8a80" stroke-width="1.2" stroke-dasharray="3,3"/>`);
  }
  if(gN1.mother.length > 1){
    const ys = positions.filter(p=>p.gen===-1 && p.member.side==='mother');
    const y = ys[0].y - BOX_H/2 - 12;
    const xs = ys.map(p=>p.x);
    lines += `<line x1="${Math.min(...xs)}" y1="${y}" x2="${Math.max(...xs)}" y2="${y}" stroke="#8a8a80" stroke-width="1.2" stroke-dasharray="3,3"/>`;
    ys.forEach(p=> lines += `<line x1="${p.x}" y1="${y}" x2="${p.x}" y2="${p.y - BOX_H/2}" stroke="#8a8a80" stroke-width="1.2" stroke-dasharray="3,3"/>`);
  }
  // 祖父母カップル → 父／母
  marriageAndDescent2(gN2.father, fatherFinal);
  marriageAndDescent2(gN2.mother, motherFinal);
  marriageAndDescent2(gN3.father, gp2f.length ? {x: gp2fCenter, y: gp2f[0].y} : null);
  marriageAndDescent2(gN3.mother, gp2m.length ? {x: gp2mCenter, y: gp2m[0].y} : null);

  function marriageAndDescent2(coupleArr, childAnchor){
    if(coupleArr.length < 1 || !childAnchor) return;
    const ps = positions.filter(p=> coupleArr.includes(p.member));
    if(ps.length === 0) return;
    if(ps.length === 2){
      lines += `<line x1="${ps[0].x}" y1="${ps[0].y}" x2="${ps[1].x}" y2="${ps[1].y}" stroke="#262622" stroke-width="1.6"/>`;
    }
    const midX = ps.length===2 ? (ps[0].x+ps[1].x)/2 : ps[0].x;
    const midY = ps[0].y;
    const dropY = childAnchor.y - BOX_H/2 - 14;
    lines += `<line x1="${midX}" y1="${midY}" x2="${midX}" y2="${dropY}" stroke="#262622" stroke-width="1.6"/>`;
    lines += `<line x1="${midX}" y1="${dropY}" x2="${childAnchor.x}" y2="${dropY}" stroke="#262622" stroke-width="1.6"/>`;
    lines += `<line x1="${childAnchor.x}" y1="${dropY}" x2="${childAnchor.x}" y2="${childAnchor.y - BOX_H/2}" stroke="#262622" stroke-width="1.6"/>`;
  }

  // 本人 → 「子」世代
  if(gP1.length){
    const selfPos = findPos(p=>p.gen===0 && p.member.isSelf);
    const childYs = positions.filter(p=>p.gen===1);
    if(selfPos && childYs.length){
      const dropY = selfPos.y + BOX_H/2 + 14;
      lines += `<line x1="${selfPos.x}" y1="${selfPos.y+BOX_H/2}" x2="${selfPos.x}" y2="${dropY}" stroke="#262622" stroke-width="1.6"/>`;
      childYs.forEach(p=>{
        lines += `<line x1="${selfPos.x}" y1="${dropY}" x2="${p.x}" y2="${dropY}" stroke="#262622" stroke-width="1.6"/>`;
        lines += `<line x1="${p.x}" y1="${dropY}" x2="${p.x}" y2="${p.y - BOX_H/2}" stroke="#262622" stroke-width="1.6"/>`;
      });
    }
  }

  // ---- 同居枠（点線） ----
  const coRes = positions.filter(p=> p.member.coRes !== false && p.gen !== 'other');
  let coResBox = '';
  if(coRes.length > 1){
    const pad = 22;
    const x1 = Math.min(...coRes.map(p=>p.x)) - BOX_W/2 - pad;
    const x2 = Math.max(...coRes.map(p=>p.x)) + BOX_W/2 + pad;
    const y1 = Math.min(...coRes.map(p=>p.y)) - BOX_H/2 - pad;
    const y2 = Math.max(...coRes.map(p=>p.y)) + BOX_H/2 + pad;
    coResBox = `<rect x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" rx="10" fill="none" stroke="#8a8a80" stroke-width="1.3" stroke-dasharray="6,4"/>`;
  }

  // ---- 図形 ----
  function shapeFor(p){
    const m = p.member;
    const cx = p.x, cy = p.y;
    const strokeW = m.isSelf ? 2.6 : 1.6;
    let shape = '';
    if(m.gender === '女性'){
      shape = `<ellipse cx="${cx}" cy="${cy}" rx="${BOX_W/2}" ry="${BOX_H/2}" fill="#fff" stroke="#262622" stroke-width="${strokeW}"/>`;
    } else if(m.gender === '男性'){
      shape = `<rect x="${cx-BOX_W/2}" y="${cy-BOX_H/2}" width="${BOX_W}" height="${BOX_H}" fill="#fff" stroke="#262622" stroke-width="${strokeW}"/>`;
    } else {
      // 性別不明はひし形
      const w=BOX_W/2, h=BOX_H/2;
      shape = `<polygon points="${cx},${cy-h} ${cx+w},${cy} ${cx},${cy+h} ${cx-w},${cy}" fill="#fff" stroke="#262622" stroke-width="${strokeW}"/>`;
    }
    const relLabel = shortLabel(m.relation || '');
    const nameLabel = m.name || '';
    let text = `<text x="${cx}" y="${cy - (nameLabel?6:0)}" text-anchor="middle" dominant-baseline="central" font-size="13" font-family="'Zen Kaku Gothic New', sans-serif" fill="#262622">${escapeXml(relLabel)}</text>`;
    if(nameLabel){
      text += `<text x="${cx}" y="${cy+12}" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-family="'Zen Kaku Gothic New', sans-serif" fill="#6B6A62">${escapeXml(nameLabel)}</text>`;
    }
    return shape + text;
  }
  function escapeXml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  // 図の中では父方／母方は位置で表現されるため、ラベルは短縮して表示する
  function shortLabel(rel){
    return String(rel).replace(/（父方）|（母方）/g, '').replace(/（世代を指定）/, '');
  }

  const shapes = positions.map(shapeFor).join('');

  const legendY = height - 14;
  const legend = `
    <g font-size="11" font-family="'Zen Kaku Gothic New', sans-serif" fill="#6B6A62">

function nextChildNo(){
  const taken = new Set(children.map(c=>c.id));
  let max = 0;
  taken.forEach(id=>{
    const m = /^C(\d+)$/.exec(String(id||''));
    if(m){ const n = parseInt(m[1],10); if(n>max) max = n; }
  });
  let n = max + 1, cand = 'C' + String(n).padStart(5,'0');
  while(taken.has(cand)){ n++; cand = 'C' + String(n).padStart(5,'0'); }
  return cand;
}

document.getElementById('excel-input').addEventListener('change', (evt)=>{
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
      let imported = 0, skipped = 0;
      const newly = [];
      rows.forEach(row=>{
        const c = {};
        KEY_ORDER.forEach(k=>{ c[k] = ''; });
        c.facility = FACILITIES[0]; c.status = '在籍中'; c.family = [];
        Object.entries(row).forEach(([h,v])=>{
          const key = HEADER_TO_KEY[String(h).trim()];
          if(!key) return;
          c[key] = DATE_KEYS.includes(key) ? excelDateToStr(v) : String(v ?? '').trim();

        if(c.id){
          if(children.some(x=>x.id === c.id)){ skipped++; return; }
        } else {
          c.id = nextChildNo();
        }
        children.push(c); newly.push(c); imported++;
      });
      renderList();
      if(isSupabaseConfigured()){
        for(const nc of newly){ await insertChildToDb(nc); }
      }
      let msg = `${imported}件の児童情報を取り込みました。`;
      if(skipped > 0) msg += `\n${skipped}件は既に同じ児童番号が登録されているため、取り込みませんでした。`;

      alert('ファイルの読み込みに失敗しました。テンプレートの列見出しと一致しているかご確認ください。');

});

// ===================== 写真のトリミング =====================
let pendingPhotoFile = null;
let cropState = null;
const CROP_VIEWPORT = 260, CROP_OUTPUT = 480;

function openCropModal(file){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = document.getElementById('crop-image');
    img.onload = ()=>{
      const nw = img.naturalWidth, nh = img.naturalHeight;
      const minScale = Math.max(CROP_VIEWPORT/nw, CROP_VIEWPORT/nh);
      cropState = { nw, nh, minScale, scale:minScale,
        offsetX:(CROP_VIEWPORT-nw*minScale)/2, offsetY:(CROP_VIEWPORT-nh*minScale)/2 };
      document.getElementById('crop-zoom').value = 1;
      applyCropTransform();
      document.getElementById('crop-modal-backdrop').style.display = 'flex';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function applyCropTransform(){
  const img = document.getElementById('crop-image');
  img.style.width = (cropState.nw*cropState.scale)+'px';
  img.style.height = (cropState.nh*cropState.scale)+'px';
  img.style.transform = `translate(${cropState.offsetX}px, ${cropState.offsetY}px)`;
}
function clampCropOffset(){
  const w = cropState.nw*cropState.scale, h = cropState.nh*cropState.scale;
  cropState.offsetX = Math.min(0, Math.max(CROP_VIEWPORT-w, cropState.offsetX));
  cropState.offsetY = Math.min(0, Math.max(CROP_VIEWPORT-h, cropState.offsetY));
}
(function setupCrop(){
  const vp = document.getElementById('crop-viewport');
  let dragging=false, sx, sy, ox, oy;
  vp.addEventListener('pointerdown', e=>{
    if(!cropState) return;
    dragging=true; vp.classList.add('dragging'); vp.setPointerCapture(e.pointerId);
    sx=e.clientX; sy=e.clientY; ox=cropState.offsetX; oy=cropState.offsetY;
  });
  vp.addEventListener('pointermove', e=>{
    if(!dragging||!cropState) return;
    cropState.offsetX = ox + (e.clientX-sx);
    cropState.offsetY = oy + (e.clientY-sy);
    clampCropOffset(); applyCropTransform();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>
    vp.addEventListener(ev, ()=>{ dragging=false; vp.classList.remove('dragging'); }));

  document.getElementById('crop-zoom').addEventListener('input', e=>{
    if(!cropState) return;
    const old = cropState.scale;
    const ns = cropState.minScale * parseFloat(e.target.value);
    const cx = CROP_VIEWPORT/2, cy = CROP_VIEWPORT/2;
    cropState.offsetX = cx - ((cx-cropState.offsetX)/old)*ns;
    cropState.offsetY = cy - ((cy-cropState.offsetY)/old)*ns;
    cropState.scale = ns; clampCropOffset(); applyCropTransform();
  });
  document.getElementById('crop-cancel').addEventListener('click', ()=>{
    document.getElementById('crop-modal-backdrop').style.display='none'; cropState=null;
  });
  document.getElementById('crop-confirm').addEventListener('click', ()=>{
    if(!cropState) return;
    const cv = document.createElement('canvas');
    cv.width = CROP_OUTPUT; cv.height = CROP_OUTPUT;
    const ctx = cv.getContext('2d');
    const img = document.getElementById('crop-image');
    const sx = -cropState.offsetX/cropState.scale;
    const sy = -cropState.offsetY/cropState.scale;
    const ss = CROP_VIEWPORT/cropState.scale;
    ctx.drawImage(img, sx, sy, ss, ss, 0, 0, CROP_OUTPUT, CROP_OUTPUT);
    tempPhoto = cv.toDataURL('image/jpeg', 0.9);
    cv.toBlob(b=>{ pendingPhotoFile = new File([b],'photo.jpg',{type:'image/jpeg'}); }, 'image/jpeg', 0.9);
    document.getElementById('crop-modal-backdrop').style.display='none';
    cropState=null; renderDetail();
  });
})();

// ===================== クラウド連携 =====================
// アプリ内のキー名 ↔ データベースの列名の対応
const COL_MAP = {
  child_no:'id', name:'name', kana:'kana', birthday:'birthday', gender:'gender',
  school:'school', photo_url:'photo', facility:'facility', status:'status',
  contract_start:'contractStart', contract_end:'contractEnd',
  days_per_month:'daysPerMonth', pickup:'pickup', diagnosis:'diagnosis',
  zip:'zip', address:'address', phone_home:'phoneHome', priority_contact:'priorityContact',
  rel1:'rel1', phone1:'phone1', rel2:'rel2', phone2:'phone2', rel3:'rel3', phone3:'phone3',
  cert_no:'certNo', municipality:'municipality',
  cert_start:'certStart', cert_end:'certEnd',
  grant_amount:'grantAmount', contract_days:'contractDays', monthly_cap:'monthlyCap',
  disability_type:'disabilityType', severe_behavior:'severeBehavior',
  individual_support:'individualSupport', cap_manage_facility:'capManageFacility',
  other_facility1:'otherFacility1', other_facility2:'otherFacility2',
  family:'family'
};
const DB_DATE_COLS = ['birthday','contract_start','contract_end','cert_start','cert_end'];

function rowToChild(row){
  const c = { dbId: row.id };
  Object.entries(COL_MAP).forEach(([col, key])=>{
    if(key === 'family'){ c[key] = Array.isArray(row[col]) ? row[col] : []; return; }
    c[key] = row[col] ?? (key === 'photo' ? null : '');
  });
  if(!c.status) c.status = '在籍中';
  return c;
}
function childToRow(c){
  const row = {};
  Object.entries(COL_MAP).forEach(([col, key])=>{
    if(col === 'family'){ row[col] = Array.isArray(c.family) ? c.family : []; return; }
    let v = c[key];
    if(DB_DATE_COLS.includes(col)) v = v || null;
    else if(col === 'photo_url') v = v || null;
    else v = v ?? '';
    row[col] = v;
  });
  return row;
}

async function loadChildrenFromDb(){
  const { data, error } = await supabaseClient.from('children_all').select('*');
  if(error){ alert('データの取得に失敗しました：' + error.message); return; }
  if(!Array.isArray(data)){ children = []; renderList(); return; }
  children = data.map(rowToChild);
  renderList();
}

async function insertChildToDb(c){
  // 挿入後に読み返すと children へのSELECT権限が必要になるため、IDはこちらで発行する
  const newId = (crypto.randomUUID) ? crypto.randomUUID() : null;
  const payload = childToRow(c);
  if(newId) payload.id = newId;
  const { error } = await supabaseClient.from('children').insert(payload);
  if(error){ alert('登録に失敗しました：' + error.message); return; }
  c.dbId = newId;
}

async function updateChildInDb(c){
  if(!c.dbId){ await insertChildToDb(c); return; }
  // UPDATE は対象行を探すのにSELECT権限が要るため、専用関数を経由する
  const { error } = await supabaseClient.rpc('update_child', {
    p_id: c.dbId, p_data: childToRow(c)
  });
  if(error){ alert('更新に失敗しました：' + error.message); }
}

async function deleteChildrenFromDb(dbIds){
  if(!dbIds || dbIds.length === 0) return true;
  const { error } = await supabaseClient.rpc('delete_children', { p_ids: dbIds });
  if(error){ alert('削除に失敗しました：' + error.message); return false; }
  return true;
}

async function uploadChildPhoto(file, c){
  const path = `${c.dbId || c.id}/${Date.now()}_${file.name}`;
  const { error } = await supabaseClient.storage.from('child-photos').upload(path, file, {upsert:true});
  if(error) throw error;
  // child-photos は非公開バケットのため、getPublicUrl ではなく長期の署名付きURLを発行する
  const { data, error: signError } = await supabaseClient.storage.from('child-photos').createSignedUrl(path, 60 * 60 * 24 * 365 * 10); // 10年
  if(signError) throw signError;
  return data.signedUrl;
}

async function checkSession(){
  const { data } = await supabaseClient.auth.getSession();
  if(data.session) await enterApp();
  else document.getElementById('login-overlay').style.display = 'flex';
}


// ===================== 無操作タイムアウト（30分） =====================
let idleTimer = null;
let sessionActive = false;
const IDLE_LIMIT_MS = 30 * 60 * 1000;

function resetIdleTimer(){
  if(!sessionActive) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(handleIdleTimeout, IDLE_LIMIT_MS);
}
async function handleIdleTimeout(){
  if(!sessionActive) return;
  sessionActive = false;
  document.getElementById('logout-btn').click();
  alert('一定時間操作がなかったため、自動的にログアウトしました。再度ログインしてください。');
}
['mousemove','keydown','mousedown','touchstart','scroll'].forEach(ev=>
  document.addEventListener(ev, resetIdleTimer, {passive:true})
);

async function enterApp(){
  document.getElementById('login-overlay').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'inline-block';
  await loadCurrentUserRole();
  await loadChildrenFromDb();
  sessionActive = true;
  resetIdleTimer();
}

const ROLE_LABELS = {
  editor:'編集可能',
  viewer_full:'閲覧のみ',
  viewer_basic:'閲覧のみ'
};

async function loadCurrentUserRole(){
  const { data: u } = await supabaseClient.auth.getUser();
  const uid = u?.user?.id;
  if(!uid){ currentUserRole = 'viewer_basic'; }
  else {
    const { data, error } = await supabaseClient
      .from('user_roles').select('role').eq('user_id', uid).single();
    currentUserRole = (!error && data) ? data.role : 'viewer_basic';
  }
  applyRolePermissions();
}

function applyRolePermissions(){
  const isEditor = currentUserRole === 'editor';
  const badge = document.getElementById('role-badge');
  badge.style.display = 'inline-block';
  badge.textContent = ROLE_LABELS[currentUserRole] || '閲覧のみ';
  document.getElementById('open-add-modal').style.display = isEditor ? '' : 'none';
  document.getElementById('open-import').style.display = isEditor ? '' : 'none';
  document.getElementById('download-template').style.display = isEditor ? '' : 'none';
  if(activeId) renderDetail();
}

document.getElementById('login-btn').addEventListener('click', async ()=>{
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    err.textContent = 'ログインに失敗しました：' + error.message;
    err.style.display = 'block';
    return;
  }
  await enterApp();
});

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  sessionActive = false;
  clearTimeout(idleTimer);
  await supabaseClient.auth.signOut();
  children = []; activeId = null;
  renderList();
  detailContent.innerHTML = '<div class="no-selection">左の一覧から児童を選択してください</div>';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('login-overlay').style.display = 'flex';
  document.getElementById('login-email').value = '';
  document.getElementById('login-password').value = '';
});

// ===================== 起動 =====================
searchInput.addEventListener('input', renderList);
facilityFilter.addEventListener('change', renderList);
statusFilter.addEventListener('change', renderList);
showNewOnly.addEventListener('change', renderList);

// サイドバーの折りたたみセクション
document.querySelectorAll('.collapsible-header').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const body = document.getElementById(btn.dataset.target);
    const willOpen = body.classList.contains('collapsed');
    body.classList.toggle('collapsed', !willOpen);
    btn.classList.toggle('open', willOpen);
  });
});
document.getElementById('btn-home').addEventListener('click', ()=>{ location.href = 'index.html'; });

initOptions();

if(isSupabaseConfigured()){
  document.getElementById('demo-banner').style.display = 'none';
  checkSession();
} else {
  renderList();
}
if(isMobile()) detailPane.classList.add('hide-on-mobile');
</script>
</body>
</html>
