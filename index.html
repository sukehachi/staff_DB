<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スタッフ情報データベース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #FAFAF6;
    --panel: #FFFFFF;
    --ink: #262622;
    --ink-soft: #6B6A62;
    --line: #DEDACC;
    --primary: #1F3A3D;
    --primary-soft: #E8EEEC;
    --accent: #93B23C;
    --accent-soft: #EEF4DC;
    --gold: #B8912A;
    --danger: #A6462F;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  h1,h2,h3,.serif{ font-family:'Zen Kaku Gothic New', sans-serif; }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    background:var(--primary);
    color:#fff;
    flex-shrink:0;
  }
  header.top .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  header.top .brand h1{
    font-size:19px;
    margin:0;
    font-weight:700;
    letter-spacing:.02em;
  }
  header.top .brand span{
    font-size:12px;
    color:#C9D6D2;
  }
  header.top select{
    background:transparent;
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    padding:6px 10px;
    font-size:13px;
    border-radius:var(--radius);
  }
  header.top select option{ color:#111; }

  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    flex:1;
    min-height:0;
  }
  @media (max-width:820px){
    .layout{ grid-template-columns:1fr; }
    .list-pane.hide-on-mobile{ display:none; }
    .detail-pane.hide-on-mobile{ display:none; }
  }

  .list-pane{
    border-right:1px solid var(--line);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
  }
  .list-pane .search-row{
    padding:14px;
    border-bottom:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:8px;
    flex-shrink:0;
  }
  .list-pane input:not([type="checkbox"]), .list-pane select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-size:14px;
    font-family:inherit;
    background:#fff;
  }
  .list-pane input:not([type="checkbox"]):focus, .list-pane select:focus{
    outline:2px solid var(--accent);
    outline-offset:-1px;
  }
  .add-btn{
    padding:9px 10px;
    border:1px solid var(--primary);
    background:var(--primary);
    color:#fff;
    border-radius:var(--radius);
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .add-btn:hover{ background:#16292b; }

  .secondary-btn{
    padding:9px 10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--primary);
    border-radius:var(--radius);
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .secondary-btn:hover{ border-color:var(--primary); }
  .btn-row{ display:flex; gap:8px; }
  .btn-row .secondary-btn, .btn-row .add-btn{ flex:1; }
  .import-note{
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  .emp-list{
    list-style:none;
    margin:0;
    padding:0;
    overflow-y:auto;
    flex:1;
    min-height:0;
  }
  .emp-list li{
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .emp-list li:hover{ background:var(--accent-soft); }
  .emp-list li.active{ background:var(--primary-soft); border-left:3px solid var(--primary); }
  .emp-list .name{ font-size:15px; font-weight:500; }
  .emp-list .kana{ font-size:11px; color:var(--ink-soft); display:block; }
  .emp-list .facility-tag{
    font-size:10.5px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:2px 6px;
    border-radius:20px;
    white-space:nowrap;
  }
  .emp-list .empty{
    padding:24px 14px;
    color:var(--ink-soft);
    font-size:13px;
    text-align:center;
  }

  .detail-pane{
    padding:24px 28px 60px;
    overflow-y:auto;
    min-height:0;
  }
  .detail-header{
    display:flex;
    gap:20px;
    align-items:flex-start;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
    margin-bottom:20px;
  }
  .back-btn{
    display:none;
    background:none;
    border:none;
    color:var(--primary);
    font-size:14px;
    cursor:pointer;
    padding:0 0 12px;
    font-family:inherit;
  }
  @media (max-width:820px){
    .back-btn.show{ display:block; }
  }
  .photo-box{
    position:relative;
    width:88px;
    height:88px;
    flex-shrink:0;
  }
  .photo{
    width:100%;
    height:100%;
    border-radius:50%;
    background:var(--primary-soft);
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:700;
    font-family:'Zen Kaku Gothic New', sans-serif;
    border:1px solid var(--line);
    overflow:hidden;
  }
  .photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .photo-edit-row{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-top:6px;
  }
  .photo-edit-row label, .photo-edit-row button{
    font-size:10.5px;
    text-align:center;
    padding:3px 4px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    color:var(--primary);
    cursor:pointer;
    font-family:inherit;
  }
  .photo-edit-row button.remove{ color:var(--danger); }
  .list-thumb{
    width:32px;
    height:32px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    border:1px solid var(--line);
  }
  .list-thumb-fallback{
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--primary-soft);
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:700;
    font-family:'Zen Kaku Gothic New', sans-serif;
    flex-shrink:0;
    border:1px solid var(--line);
  }
  .detail-header .id-block h2{
    margin:0 0 2px;
    font-size:22px;
  }
  .detail-header .id-block .kana{
    color:var(--ink-soft);
    font-size:13px;
    margin-bottom:8px;
    display:block;
  }
  .badge-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .badge{
    font-size:11.5px;
    padding:3px 9px;
    border-radius:20px;
    border:1px solid var(--line);
    color:var(--ink-soft);
  }
  .badge.role{ background:var(--accent-soft); color:#57692A; border-color:transparent; }
  .badge.status-active{ background:var(--accent-soft); color:#57692A; border-color:transparent; }
  .badge.status-leave{ background:#F5EBE5; color:var(--danger); border-color:transparent; }

  .edit-toggle{
    margin-left:auto;
    align-self:flex-start;
    background:none;
    border:1px solid var(--line);
    padding:7px 14px;
    font-size:13px;
    border-radius:var(--radius);
    cursor:pointer;
    color:var(--primary);
    font-family:inherit;
  }
  .edit-toggle:hover{ border-color:var(--primary); }

  .tabs{
    display:flex;
    gap:2px;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
  }
  .tab-btn{
    background:none;
    border:none;
    padding:10px 4px;
    margin-right:22px;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    font-family:inherit;
  }
  .tab-btn.active{
    color:var(--primary);
    border-bottom-color:var(--primary);
    font-weight:500;
  }

  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px 32px;
  }
  @media (max-width:600px){
    .field-grid{ grid-template-columns:1fr; }
  }
  .field-grid.span-2{ grid-template-columns:1fr; }
  .field{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .field label{
    font-size:11.5px;
    color:var(--ink-soft);
    letter-spacing:.02em;
  }
  .field .value{
    font-size:15px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
    min-height:22px;
  }
  .field input, .field select{
    font-size:15px;
    padding:6px 2px;
    border:none;
    border-bottom:1px solid var(--accent);
    background:var(--accent-soft);
    font-family:inherit;
  }
  .field input:focus{ outline:none; }

  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .save-row{
    margin-top:28px;
    display:flex;
    gap:10px;
  }
  .save-row button{
    font-family:inherit;
    font-size:14px;
    padding:9px 20px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .save-row .save{ background:var(--primary); color:#fff; border:1px solid var(--primary); }
  .save-row .cancel{ background:none; color:var(--ink-soft); border:1px solid var(--line); }

  .no-selection{
    color:var(--ink-soft);
    font-size:14px;
    padding:60px 20px;
    text-align:center;
  }

  .hist-title{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 10px;
    letter-spacing:.02em;
  }
  table.hist-table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
  }
  table.hist-table th{
    text-align:left;
    font-size:11.5px;
    font-weight:500;
    color:var(--ink-soft);
    border-bottom:1px solid var(--line);
    padding:6px 8px;
  }
  table.hist-table td{
    padding:8px;
    border-bottom:1px solid var(--line);
  }
  table.hist-table input, table.hist-table select{
    width:100%;
    font-size:14px;
    font-family:inherit;
    border:1px solid var(--line);
    padding:5px 6px;
    border-radius:var(--radius);
  }
  .hist-remove{
    background:none;
    border:none;
    color:var(--danger);
    font-size:12.5px;
    cursor:pointer;
    font-family:inherit;
  }
  .hist-add{
    margin-top:10px;
    background:none;
    border:1px dashed var(--line);
    color:var(--primary);
    padding:7px 12px;
    font-size:13px;
    border-radius:var(--radius);
    cursor:pointer;
    font-family:inherit;
  }
  .hist-add:hover{ border-color:var(--primary); }

  /* --- Add employee modal (simple inline panel) --- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(31,58,61,.35);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
  }
  .modal{
    background:#fff; width:min(480px, 92vw);
    padding:24px; border-radius:var(--radius);
    max-height:86vh; overflow-y:auto;
  }
  .modal h3{ margin-top:0; }
  .modal .field{ margin-bottom:14px; }
  .modal .field input, .modal .field select{
    border:1px solid var(--line);
    background:#fff;
    padding:8px;
    border-radius:var(--radius);
  }

  .demo-banner{
    background:#FBF1D6;
    color:#6B5417;
    font-size:12.5px;
    text-align:center;
    padding:6px 10px;
    flex-shrink:0;
  }
  .logout-btn{
    background:none;
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    padding:6px 12px;
    font-size:12.5px;
    border-radius:var(--radius);
    cursor:pointer;
    font-family:inherit;
    margin-left:10px;
  }
  #login-error{
    color:var(--danger);
    font-size:13px;
    display:none;
    margin-top:4px;
  }
</style>
</head>
<body>

<div class="demo-banner" id="demo-banner" style="display:none;">
  ⚠ デモモード：Supabase未接続のため、この端末内だけの仮データで動作しています
</div>

<header class="top">
  <div class="brand">
    <h1>フォーグリーン スタッフDB</h1>
    <span id="facility-count-label">全10施設</span>
  </div>
  <div>
    <select id="facility-filter">
      <option value="all">全施設を表示</option>
    </select>
    <span id="role-badge" class="logout-btn" style="display:none; cursor:default;"></span>
    <button class="logout-btn" id="logout-btn" style="display:none;">ログアウト</button>
  </div>
</header>

<div class="layout">
  <aside class="list-pane" id="list-pane">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="氏名・フリガナ・施設名で検索">
      <select id="status-filter">
        <option value="active">在籍者のみ表示</option>
        <option value="all">全員表示（退職者含む）</option>
        <option value="retired">退職者のみ表示</option>
      </select>
      <select id="employment-filter">
        <option value="all">全雇用区分を表示</option>
      </select>
      <button class="add-btn" id="open-add-modal">＋ スタッフを新規追加</button>
      <div class="btn-row">
        <button class="secondary-btn" id="download-template">テンプレートDL</button>
        <button class="secondary-btn" id="open-import">Excelから取込</button>
      </div>
      <input type="file" id="excel-input" accept=".xlsx,.xls,.csv" style="display:none;">
      <div class="import-note">テンプレートの列見出しに合わせて入力したExcelファイルを取り込めます。既存データに追加されます。</div>
    </div>
    <ul class="emp-list" id="emp-list"></ul>
  </aside>

  <section class="detail-pane" id="detail-pane">
    <button class="back-btn" id="back-btn">← 一覧に戻る</button>
    <div id="detail-content">
      <div class="no-selection">左の一覧からスタッフを選択してください</div>
    </div>
  </section>
</div>

<div class="modal-backdrop" id="login-overlay" style="display:none;">
  <div class="modal">
    <h3 class="serif">ログイン</h3>
    <div class="field"><label>メールアドレス</label><input id="login-email" type="email" placeholder="staff@example.com"></div>
    <div class="field"><label>パスワード</label><input id="login-password" type="password"></div>
    <div class="save-row">
      <button class="save" id="login-btn">ログイン</button>
    </div>
    <p id="login-error"></p>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop" style="display:none;">
  <div class="modal">
    <h3 class="serif">スタッフ新規登録</h3>
    <div class="field"><label>氏名</label><input id="m-name" placeholder="山田 太郎"></div>
    <div class="field"><label>フリガナ</label><input id="m-kana" placeholder="ヤマダ タロウ"></div>
    <div class="field">
      <label>所属施設</label>
      <select id="m-facility"></select>
    </div>
    <div class="field"><label>役職</label><input id="m-role" placeholder="児童指導員 / サービス管理責任者 など"></div>
    <div class="field"><label>雇用区分</label>
      <select id="m-employment"></select>
    </div>
    <div class="field"><label>入社日</label><input id="m-join" type="date"></div>
    <div class="save-row">
      <button class="save" id="m-save">登録する</button>
      <button class="cancel" id="m-cancel">キャンセル</button>
    </div>
  </div>
</div>

<script>
// ================= クラウド接続設定 =================
// Supabaseプロジェクトの Project URL と anon public key に書き換えてください。
// 未設定（初期値のまま）の場合はデモモードで動作します（この端末内だけの仮データ）。
const SUPABASE_URL = 'https://abfzvigpxdogsxxtfrvk.supabase.co';

  return SUPABASE_URL && !SUPABASE_URL.includes('ここに') &&
         SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('ここに');
}

const supabaseClient = isSupabaseConfigured()
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// ---------- サンプルデータ（デモモード用のダミー値。クラウド接続時はDBの内容に置き換わります） ----------
const FIELD_FACILITIES = [

const FACILITIES = [...FIELD_FACILITIES, ...HQ_FACILITIES];

const EMPLOYMENT_TYPES = ['社員', '常勤パート', 'パート', 'パートドライバー'];

let employees = [
  {

    facility: "西新井本部", role: "サービス管理責任者", employment: "正社員",
    status: "在籍中", birthday: "1990-04-12", gender: "女性",
    joinDate: "2019-06-01", address: "東京都足立区西新井本町2-3-1",
    phone: "090-1234-5678", email: "sato@example.com",

      { date:"2021-04-01", type:"昇格", facility:"西新井本部", role:"サービス管理責任者" }
    ]
  },
  {

    facility: "竹の塚ステップ", role: "児童指導員", employment: "正社員",
    status: "在籍中", birthday: "1993-11-02", gender: "男性",

  {

    status: "産休・育休中", birthday: "1997-02-20", gender: "女性",
    joinDate: "2023-09-01", address: "東京都足立区梅島1-5-2",
    phone: "070-1111-2222", email: "tanaka@example.com",

    notes: "",
    history: [
      { date:"2023-09-01", type:"配属", facility:"梅島LC", role:"保育士" }
    ]
  }
];

let tempHistory = null;
let tempPhoto = null;
let pendingPhotoFile = null;
let currentUserRole = 'editor'; // デモモード・クラウド未接続時は編集可扱い

let activeId = null;
let editing = false;
let activeTab = 'basic';

const listEl = document.getElementById('emp-list');
const detailContent = document.getElementById('detail-content');
const searchInput = document.getElementById('search-input');
const facilityFilter = document.getElementById('facility-filter');
const listPane = document.getElementById('list-pane');
const detailPane = document.getElementById('detail-pane');
const backBtn = document.getElementById('back-btn');

function buildFacilityOptionsHTML(selected){
  const fieldOpts = FIELD_FACILITIES.map(f => `<option ${f===selected?'selected':''}>${f}</option>`).join('');
  const hqOpts = HQ_FACILITIES.map(f => `<option ${f===selected?'selected':''}>${f}</option>`).join('');
  return `<optgroup label="施設">${fieldOpts}</optgroup><optgroup label="本社">${hqOpts}</optgroup>`;
}

function initFacilityOptions(){
  facilityFilter.insertAdjacentHTML('beforeend', buildFacilityOptionsHTML(null));

function isMobile(){ return window.innerWidth <= 820; }

function renderList(){
  const q = searchInput.value.trim();
  const fac = facilityFilter.value;
  const statusMode = document.getElementById('status-filter').value;
  const empFilter = document.getElementById('employment-filter').value;
  listEl.innerHTML = '';
  const filtered = employees.filter(e=>{
    const matchesQ = !q || e.name.includes(q) || e.kana.includes(q) || e.facility.includes(q);
    const matchesFac = fac === 'all' || e.facility === fac;
    let matchesStatus = true;
    if(statusMode === 'active') matchesStatus = e.status !== '退職';
    else if(statusMode === 'retired') matchesStatus = e.status === '退職';
    const matchesEmployment = empFilter === 'all' || e.employment === empFilter;
    return matchesQ && matchesFac && matchesStatus && matchesEmployment;
  });
  if(filtered.length === 0){
    listEl.innerHTML = '<li class="empty">該当するスタッフがいません</li>';
    return;
  }
  filtered.forEach(e=>{
    const li = document.createElement('li');
    li.className = e.id === activeId ? 'active' : '';
    const thumb = e.photo
      ? `<img class="list-thumb" src="${e.photo}">`
      : `<div class="list-thumb-fallback">${e.name.charAt(0)}</div>`;
    li.innerHTML = `
      ${thumb}
      <div style="flex:1;">
        <span class="name">${e.name}</span>
        <span class="kana">${e.kana}</span>
      </div>
      <span class="facility-tag">${e.facility}</span>
    `;
    li.addEventListener('click', ()=>selectEmployee(e.id));
    listEl.appendChild(li);
  });
}

function selectEmployee(id){
  activeId = id;
  editing = false;
  activeTab = 'basic';
  tempHistory = null;
  tempPhoto = null;
  pendingPhotoFile = null;
  renderList();
  renderDetail();
  if(isMobile()){
    listPane.classList.add('hide-on-mobile');
    detailPane.classList.remove('hide-on-mobile');
    backBtn.classList.add('show');
  }
}

backBtn.addEventListener('click', ()=>{

  detailPane.classList.add('hide-on-mobile');

function statusBadgeClass(status){
  if(status === '在籍中') return 'status-active';
  if(status === '休職中' || status === '産休・育休中') return 'status-leave';
  return '';
}

function syncTempHistoryFromInputs(){
  const tbody = document.getElementById('hist-tbody');
  if(!tbody) return;
  tbody.querySelectorAll('input[data-hist-idx], select[data-hist-idx]').forEach(inp=>{
    const idx = Number(inp.dataset.histIdx);
    const key = inp.dataset.histField;
    if(tempHistory[idx]) tempHistory[idx][key] = inp.value;
  });
}

function renderHistoryRows(e){
  const rows = editing ? (tempHistory || []) : (e.history || []);
  if(rows.length === 0){
    return `<tr><td colspan="${editing?5:4}" style="color:var(--ink-soft); font-size:13px;">登録されている異動履歴はありません</td></tr>`;
  }
  return rows.map((h, idx)=>{
    if(editing){
      return `<tr>
        <td><input type="date" data-hist-idx="${idx}" data-hist-field="date" value="${h.date||''}"></td>
        <td><select data-hist-idx="${idx}" data-hist-field="type">${['配属','異動','昇格','降格','退職'].map(t=>`<option ${t===h.type?'selected':''}>${t}</option>`).join('')}</select></td>
        <td><select data-hist-idx="${idx}" data-hist-field="facility">${buildFacilityOptionsHTML(h.facility)}</select></td>
        <td><input type="text" data-hist-idx="${idx}" data-hist-field="role" value="${h.role||''}"></td>
        <td><button class="hist-remove" data-hist-idx="${idx}">削除</button></td>
      </tr>`;
    }
    return `<tr><td>${h.date||''}</td><td>${h.type||''}</td><td>${h.facility||''}</td><td>${h.role||''}</td></tr>`;
  }).join('');
}

function field(label, obj, key, type='text'){
  if(editing){
    return `<div class="field"><label>${label}</label><input data-field="${key}" type="${type}" value="${obj[key] ?? ''}"></div>`;
  }
  return `<div class="field"><label>${label}</label><div class="value">${obj[key] || '—'}</div></div>`;
}

function selectField(label, obj, key, options){
  if(editing){
    const opts = options.map(o=>`<option ${o===obj[key]?'selected':''}>${o}</option>`).join('');
    return `<div class="field"><label>${label}</label><select data-field="${key}">${opts}</select></div>`;
  }
  return `<div class="field"><label>${label}</label><div class="value">${obj[key] || '—'}</div></div>`;
}

function facilitySelectField(label, obj, key){
  if(editing){
    return `<div class="field"><label>${label}</label><select data-field="${key}">${buildFacilityOptionsHTML(obj[key])}</select></div>`;
  }
  return `<div class="field"><label>${label}</label><div class="value">${obj[key] || '—'}</div></div>`;
}

// 生年月日・入社日から自動計算する表示専用の項目（編集不可）
function derivedField(label, value){
  return `<div class="field"><label>${label}</label><div class="value">${value}</div></div>`;
}

function calcAge(birthday){
  if(!birthday) return '—';
  const b = new Date(birthday);
  if(isNaN(b)) return '—';
  const today = new Date();
  let age = today.getFullYear() - b.getFullYear();
  const beforeBirthdayThisYear = (today.getMonth() < b.getMonth()) ||
    (today.getMonth() === b.getMonth() && today.getDate() < b.getDate());
  if(beforeBirthdayThisYear) age--;
  return age + '歳';
}

function calcTenure(joinDate){
  if(!joinDate) return '—';
  const j = new Date(joinDate);
  if(isNaN(j)) return '—';
  const today = new Date();
  let years = today.getFullYear() - j.getFullYear();
  let months = today.getMonth() - j.getMonth();
  if(today.getDate() < j.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  if(years <= 0 && months <= 0) return '1ヶ月未満';
  const parts = [];
  if(years > 0) parts.push(years + '年');
  if(months > 0) parts.push(months + 'ヶ月');
  return parts.join('');
}

// ---------- Excelテンプレート ダウンロード / 取込 ----------
const TEMPLATE_HEADERS = [
  "氏名","フリガナ","職員番号","所属施設","役職","雇用区分","在籍状況",
  "生年月日","性別","入社日","住所","電話番号","メールアドレス",
  "緊急連絡先氏名","緊急連絡先電話番号","備考"
];

const HEADER_TO_KEY = {
  "氏名":"name", "フリガナ":"kana", "職員番号":"id", "所属施設":"facility",
  "役職":"role", "雇用区分":"employment", "在籍状況":"status",
  "生年月日":"birthday", "性別":"gender", "入社日":"joinDate",
  "住所":"address", "電話番号":"phone", "メールアドレス":"email",
  "緊急連絡先氏名":"emergencyName", "緊急連絡先電話番号":"emergencyPhone", "備考":"notes"
};

function excelDateToStr(v){
  if(v instanceof Date && !isNaN(v)){
    const y = v.getFullYear();
    const m = String(v.getMonth()+1).padStart(2,'0');
    const d = String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  return v ?? '';
}

document.getElementById('download-template').addEventListener('click', ()=>{
  const wb = XLSX.utils.book_new();
  const sampleRow = TEMPLATE_HEADERS.map(h => h === "所属施設" ? FACILITIES[0] : (h === "雇用区分" ? "社員" : (h === "在籍状況" ? "在籍中" : "")));
  const ws = XLSX.utils.aoa_to_sheet([TEMPLATE_HEADERS, sampleRow]);
  ws['!cols'] = TEMPLATE_HEADERS.map(()=>({wch:16}));
  XLSX.utils.book_append_sheet(wb, ws, "スタッフ一覧");
  XLSX.writeFile(wb, "スタッフ情報_取込テンプレート.xlsx");
});

document.getElementById('open-import').addEventListener('click', ()=>{
  document.getElementById('excel-input').click();
});

document.getElementById('excel-input').addEventListener('change', async (evt)=>{
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});

      let importedCount = 0;
      const newlyImported = [];
      rows.forEach(row=>{
        const emp = {
          id:'', name:'', kana:'', facility: FACILITIES[0], role:'', employment:'正社員',
          status:'在籍中', birthday:'', gender:'', joinDate:'', address:'', phone:'',
          email:'', emergencyName:'', emergencyPhone:'', notes:'', history:[]
        };
        Object.entries(row).forEach(([header, value])=>{
          const key = HEADER_TO_KEY[header.trim()];
          if(!key) return;
          if(key === 'birthday' || key === 'joinDate'){
            emp[key] = excelDateToStr(value);
          } else {
            emp[key] = String(value ?? '').trim();
          }
        });
        if(!emp.name) return; // 氏名が無い行はスキップ
        if(!emp.id){
          emp.id = 'S' + String(10000 + employees.length + importedCount + Math.floor(Math.random()*89)).slice(-5);
        }
        employees.push(emp);
        newlyImported.push(emp);
        importedCount++;
      });

      renderList();

      if(isSupabaseConfigured()){
        for(const emp of newlyImported){
          await insertEmployeeToDb(emp);
        }
      }

      alert(`${importedCount}件のスタッフ情報を取り込みました。`);
    } catch(err){
      alert('ファイルの読み込みに失敗しました。テンプレートの列見出しと一致しているかご確認ください。');
      console.error(err);
    } finally {
      evt.target.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
});

// ================= クラウド連携（Supabase） =================

function rowToEmployee(row){
  return {
    id: row.staff_no || row.id,
    dbId: row.id,
    name: row.name, kana: row.kana, facility: row.facility, role: row.role,
    employment: row.employment, status: row.status, birthday: row.birthday || '',
    gender: row.gender || '', joinDate: row.join_date || '', address: row.address || '',
    phone: row.phone || '', email: row.email || '', emergencyName: row.emergency_name || '',
    emergencyPhone: row.emergency_phone || '', notes: row.notes || '', photo: row.photo_url || null,
    history: (row.employee_history || []).map(h => ({date: h.date, type: h.type, facility: h.facility, role: h.role}))
  };
}

function employeeToRow(emp){
  return {
    staff_no: emp.id, name: emp.name, kana: emp.kana, facility: emp.facility, role: emp.role,
    employment: emp.employment, status: emp.status, birthday: emp.birthday || null,
    gender: emp.gender, join_date: emp.joinDate || null, address: emp.address, phone: emp.phone,
    email: emp.email, emergency_name: emp.emergencyName, emergency_phone: emp.emergencyPhone,
    notes: emp.notes, photo_url: emp.photo || null
  };
}

async function loadEmployeesFromDb(){
  const { data, error } = await supabaseClient.from('employees').select('*, employee_history(*)');
  if(error){
    alert('データの取得に失敗しました：' + error.message);
    return;
  }
  employees = data.map(rowToEmployee);
  renderList();
}

async function insertEmployeeToDb(emp){
  const { data, error } = await supabaseClient.from('employees').insert(employeeToRow(emp)).select().single();
  if(error){ alert('登録に失敗しました：' + error.message); return; }
  emp.dbId = data.id;
  if(emp.history && emp.history.length){
    await supabaseClient.from('employee_history').insert(
      emp.history.map(h => ({...h, employee_id: data.id}))
    );
  }
}

async function updateEmployeeInDb(emp){
  if(!emp.dbId){ await insertEmployeeToDb(emp); return; }
  const { error } = await supabaseClient.from('employees').update(employeeToRow(emp)).eq('id', emp.dbId);
  if(error){ alert('更新に失敗しました：' + error.message); return; }
  // 履歴は入れ替え方式（既存を削除して保存内容を入れ直す）
  await supabaseClient.from('employee_history').delete().eq('employee_id', emp.dbId);
  if(emp.history && emp.history.length){
    await supabaseClient.from('employee_history').insert(
      emp.history.map(h => ({...h, employee_id: emp.dbId}))
    );
  }
}

async function uploadPhotoToStorage(file, emp){
  const path = `${emp.dbId || emp.id}/${Date.now()}_${file.name}`;
  const { error: uploadError } = await supabaseClient.storage.from('staff-photos').upload(path, file, {upsert:true});
  if(uploadError){ throw uploadError; }
  const { data } = supabaseClient.storage.from('staff-photos').getPublicUrl(path);
  return data.publicUrl;
}

}

async function loadCurrentUserRole(){
  const { data: userData } = await supabaseClient.auth.getUser();
  const uid = userData?.user?.id;
  if(!uid){ currentUserRole = 'viewer'; }
  else {
    const { data, error } = await supabaseClient
      .from('user_roles')
      .select('role')
      .eq('user_id', uid)
      .single();
    currentUserRole = (!error && data) ? data.role : 'viewer';
  }
  applyRolePermissions();
}

function applyRolePermissions(){
  const isEditor = currentUserRole === 'editor';
  const badge = document.getElementById('role-badge');
  badge.style.display = 'inline-block';
  badge.textContent = isEditor ? '編集可能' : '閲覧のみ';
  document.getElementById('open-add-modal').style.display = isEditor ? '' : 'none';
  document.getElementById('open-import').style.display = isEditor ? '' : 'none';
}

document.getElementById('login-btn').addEventListener('click', async ()=>{
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    errEl.textContent = 'ログインに失敗しました：' + error.message;
    errEl.style.display = 'block';
    return;
  }
  await enterApp();
});

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  await supabaseClient.auth.signOut();
  employees = [];
  activeId = null;
  renderList();
  detailContent.innerHTML = '<div class="no-selection">左の一覧からスタッフを選択してください</div>';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('login-overlay').style.display = 'flex';
});

// ================= 起動処理 =================
initFacilityOptions();
initEmploymentOptions();

if(isSupabaseConfigured()){
  checkSession();
} else {
  document.getElementById('demo-banner').style.display = 'block';
  renderList();
}

if(isMobile()){
  detailPane.classList.add('hide-on-mobile');
}
</script>
</body>
</html>
