<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式会社フォーグリーン データベース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF6; --panel:#FFFFFF; --ink:#262622; --ink-soft:#6B6A62;
    --line:#DEDACC; --radius:3px;
    --staff:#7A9E38;  --staff-soft:#F0F5E4;
    --child:#C2772A;  --child-soft:#FBF0E2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Zen Kaku Gothic New',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; background:#3A3A34; color:#fff; flex-shrink:0;
  }
  header.top h1{ font-size:17px; margin:0; font-weight:700; letter-spacing:.02em; }
  header.top .right{ display:flex; align-items:center; gap:10px; font-size:12.5px; }
  header.top .user{ color:#D9D7CC; }
  .role-badge{
    border:1px solid rgba(255,255,255,.45); padding:4px 10px;
    border-radius:20px; font-size:11.5px;
  }
  .logout{
    background:none; border:1px solid rgba(255,255,255,.55); color:#fff;
    padding:5px 12px; font-size:12px; border-radius:var(--radius);
    cursor:pointer; font-family:inherit;
  }

  main{
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:40px 24px 60px;
  }
  .greeting{ text-align:center; margin-bottom:38px; }
  .greeting h2{ font-size:26px; margin:0 0 8px; font-weight:700; }
  .greeting p{ font-size:14px; color:var(--ink-soft); margin:0; }

  .cards{ display:flex; gap:26px; flex-wrap:wrap; justify-content:center; }
  .card{
    width:330px; background:var(--panel); border:1px solid var(--line);
    border-radius:6px; overflow:hidden; cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column; text-align:left;
    padding:0; font-family:inherit; color:inherit;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 10px 26px rgba(38,38,34,.12); }
  .card .stripe{ height:6px; }
  .card.staff .stripe{ background:var(--staff); }
  .card.child .stripe{ background:var(--child); }

  .card .body{ padding:34px 28px 30px; flex:1; }
  .icon-circle{
    width:66px; height:66px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; margin-bottom:20px;
  }
  .card.staff .icon-circle{ background:var(--staff-soft); }
  .card.child .icon-circle{ background:var(--child-soft); }

  .card h3{ font-size:21px; margin:0 0 6px; font-weight:700; }
  .card.staff h3{ color:#4E6B22; }
  .card.child h3{ color:#8E5417; }
  .card .desc{ font-size:13px; color:var(--ink-soft); line-height:1.7; margin:0 0 18px; }
  .card ul{ margin:0; padding-left:17px; font-size:12.5px; color:var(--ink-soft); line-height:1.9; }

  .card .foot{
    padding:14px 28px; border-top:1px solid var(--line);
    font-size:13px; font-weight:700; display:flex;
    justify-content:space-between; align-items:center;
  }
  .card.staff .foot{ background:var(--staff-soft); color:#4E6B22; }
  .card.child .foot{ background:var(--child-soft); color:#8E5417; }

  .foot-note{
    margin-top:40px; font-size:12px; color:var(--ink-soft); text-align:center; line-height:1.8;
  }

  @media (max-width:760px){
    header.top{ padding:12px 16px; flex-wrap:wrap; gap:8px; }
    header.top h1{ font-size:15px; }
    header.top .right{ gap:8px; font-size:11.5px; width:100%; justify-content:flex-end; }
    header.top .user{ margin-right:auto; }
    main{ padding:28px 18px 50px; justify-content:flex-start; }
    .greeting{ margin-bottom:26px; }
    .greeting h2{ font-size:21px; }
    .cards{ flex-direction:column; gap:18px; width:100%; }
    .card{ width:100%; }
    .card .body{ padding:24px 22px 20px; }
    .icon-circle{ width:56px; height:56px; margin-bottom:16px; }
  }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(38,38,34,.45);
    display:flex; align-items:center; justify-content:center; z-index:60;
  }
  .modal{
    background:#fff; width:min(420px, 92vw); padding:28px;
    border-radius:6px;
  }
  .modal h3{ margin:0 0 4px; font-size:19px; }
  .modal .lead{ font-size:12.5px; color:var(--ink-soft); margin:0 0 20px; }
  .modal .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .modal .field label{ font-size:11.5px; color:var(--ink-soft); }
  .modal .field input{
    border:1px solid var(--line); background:#fff; padding:9px;
    border-radius:var(--radius); font-size:15px; font-family:inherit;
  }
  .modal .field input:focus{ outline:2px solid var(--staff); outline-offset:-1px; }
  .modal .login-btn{
    width:100%; background:var(--staff); color:#fff; border:1px solid var(--staff);
    padding:11px; font-size:15px; border-radius:var(--radius);
    cursor:pointer; font-family:inherit; margin-top:6px;
  }
  #login-error{ color:#A6462F; font-size:13px; display:none; margin:10px 0 0; }
  body.locked main{ filter:blur(3px); pointer-events:none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="modal-backdrop" id="login-overlay" style="display:none;">
  <div class="modal">
    <h3>ログイン</h3>
    <p class="lead">株式会社フォーグリーン データベース</p>
    <div class="field"><label>メールアドレス</label><input id="login-email" type="email" placeholder="staff@example.com"></div>
    <div class="field"><label>パスワード</label><input id="login-password" type="password"></div>
    <button class="login-btn" id="login-btn">ログイン</button>
    <p id="login-error"></p>
  </div>
</div>

<header class="top">
  <h1>株式会社フォーグリーン データベース</h1>
  <div class="right">
    <span class="user" id="user-name"></span>
    <span class="role-badge" id="role-badge" style="display:none;"></span>
    <button class="logout" id="logout-btn" style="display:none;">ログアウト</button>
  </div>
</header>

<main>
  <div class="greeting">
    <h2 id="greet">おつかれさまです</h2>
    <p>どちらの情報を開きますか？</p>
  </div>

  <div class="cards">
    <button class="card staff" id="card-staff">
      <div class="stripe"></div>
      <div class="body">
        <div class="icon-circle">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4E6B22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <h3>スタッフ情報</h3>
        <p class="desc">職員の情報を確認・管理します。</p>
      </div>
      <div class="foot"><span>開く</span><span>→</span></div>
    </button>

    <button class="card child" id="card-child">
      <div class="stripe"></div>
      <div class="body">
        <div class="icon-circle">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8E5417" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4.2"/>
            <path d="M4.5 21v-1.2A5.8 5.8 0 0 1 10.3 14h3.4a5.8 5.8 0 0 1 5.8 5.8V21"/>
            <path d="M10.3 7.4h.01"/><path d="M13.7 7.4h.01"/>
          </svg>
        </div>
        <h3>児童情報</h3>
        <p class="desc">利用児童の情報を確認・管理します。</p>
      </div>
      <div class="foot"><span>開く</span><span>→</span></div>
    </button>
  </div>

  <p class="foot-note">
    ※ 表示できる範囲はアカウントの権限によって異なります。<br>
    情報の取り扱いにはご注意ください。端末を離れるときは必ずログアウトしてください。
  </p>

</main>

<script>
// ===================== クラウド接続設定 =====================
const SUPABASE_URL = 'https://abfzvigpxdogsxxtfrvk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ZI27NjYkmAC-XbCxVVsqTw_2Rla1Je8';

// 各データベースのファイル名（同じフォルダに置く前提）
const STAFF_URL    = 'staff.html';
const CHILDREN_URL = 'children.html';

function isSupabaseConfigured(){
  return SUPABASE_URL && !SUPABASE_URL.includes('ここに') &&
         SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('ここに');
}
const supabaseClient = isSupabaseConfigured()
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const ROLE_LABELS = {
  editor:'編集可能',
  viewer_full:'閲覧のみ（詳細情報）',
  viewer_basic:'閲覧のみ（基本情報）'
};

// ===================== 認証 =====================
async function checkSession(){
  const { data } = await supabaseClient.auth.getSession();
  if(data.session) await enterApp();
  else showLogin();
}

function showLogin(){
  document.body.classList.add('locked');
  document.getElementById('login-overlay').style.display = 'flex';
  document.getElementById('user-name').textContent = '';
  document.getElementById('role-badge').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'none';
}

async function enterApp(){
  document.body.classList.remove('locked');
  document.getElementById('login-overlay').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'inline-block';

  const { data: u } = await supabaseClient.auth.getUser();
  const uid = u?.user?.id;
  document.getElementById('user-name').textContent = u?.user?.email || '';

  let role = 'viewer_basic';
  if(uid){
    const { data, error } = await supabaseClient
      .from('user_roles').select('role').eq('user_id', uid).single();
    if(!error && data) role = data.role;
  }
  const badge = document.getElementById('role-badge');
  badge.textContent = ROLE_LABELS[role] || '閲覧のみ';
  badge.style.display = 'inline-block';
}

document.getElementById('login-btn').addEventListener('click', async ()=>{
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    err.textContent = 'ログインに失敗しました：' + error.message;
    err.style.display = 'block';
    return;
  }
  await enterApp();
});

document.getElementById('login-password').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('login-btn').click();
});

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  await supabaseClient.auth.signOut();
  showLogin();
});

// ===================== 画面遷移 =====================
document.getElementById('card-staff').addEventListener('click', ()=>{
  location.href = STAFF_URL;
});
document.getElementById('card-child').addEventListener('click', ()=>{
  location.href = CHILDREN_URL;
});

// 時間帯であいさつを変える
(function(){
  const h = new Date().getHours();
  document.getElementById('greet').textContent =
    h < 11 ? 'おはようございます' : 'おつかれさまです';
})();

if(isSupabaseConfigured()){
  checkSession();
} else {
  document.getElementById('user-name').textContent = 'デモモード';
}
</script>
</body>
</html>
